      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { UserId: { type: integer }, NewPassword: { type: string } }
              required: [UserId, NewPassword]
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
  /platformapi/core/system/usergroup:
