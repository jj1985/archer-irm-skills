openapi: 3.1.0
info:
  title: Archer IRM Platform APIs
  version: "2026.08"
  summary: RESTful API, Content API (OData), V2 APIs, Data Gateway API and NGRX entry points of the Archer Integrated Risk Management platform.
  description: |
    Reconstructed from the official Archer API Help, release 2026.08
    (https://help.archerirm.cloud/api_202608/content/api/archer_apis.htm), crawled 2026-10-19.
    Archer publishes no machine-readable spec for these APIs, so this document is derived from the
    prose documentation and its example payloads. Response schemas are therefore *representative*
    (built from documented examples), not exhaustive. Treat unknown properties as allowed.

    ## API families covered
    | Family | Base path | Auth | Format |
    |---|---|---|---|
    | RESTful API ("Platform API") | `/platformapi/core/...` (alias `/api/core/...`) | `Authorization: Archer session-id=<token>` | JSON (XML via Accept) |
    | V2 API (OData-style) | `/api/V2/...` | same header; PATs accepted | JSON |
    | Data Gateway API | `/platformapi/DataGateway/...` | same header | JSON |
    | Content API | `/contentapi/...` | same header, or cookie `ArcherSessionCookie` | OData v4 JSON |
    | Next Generation Risk Experience (NGRX, SaaS only) | `/ngrx/record/v1/...` | cookie `__ArcherSessionCookie__` or JWT cookie | JSON |

    The Web Services API (SOAP, `/ws/*.asmx`) is **not** expressible in OpenAPI; see the companion
    `web-services-method-catalog.md` reference in the skill.

    ## Path prefixes
    The documentation uses `/platformapi/core/...` and `/api/core/...` interchangeably for the same
    controllers (both are served by the same application). This spec standardises on
    `/platformapi/core/...`. Where a page documented the other form, the operation carries
    `x-archer-documented-path`. If an endpoint returns 404 under one prefix, retry with the other.
    On SaaS tenants the `{instance}` path segment (usually `Archer` on-prem) may be absent, so
    set the `instance` server variable accordingly (empty is not allowed by OpenAPI; use the
    documented value for your tenant).

    ## Reads via POST + X-Http-Method-Override
    Most read operations are documented as `POST` with the header `X-Http-Method-Override: GET`
    (so that OData options can travel in the request body as `{"Value":"?$select=...&$top=..."}`
    instead of a logged query string). Plain `GET` with a query string also works for these
    resources. Operations that are documented *only* with the override pattern are modelled as
    `POST` with the required header; operations documented as `GET` are modelled as `GET`.
    Every `GET` in this spec may also be issued as `POST` + override.

    ## Envelope
    Platform API responses wrap the payload in `ApiResponse`
    (`Links`, `RequestedObject`, `IsSuccessful`, `ValidationMessages`). Collections are arrays of
    envelopes. Validation failures still return HTTP 200 with `IsSuccessful:false`, so always
    inspect `IsSuccessful` and `ValidationMessages`. V2 APIs instead return bare objects and
    OData-style `CustomErrorResponse` errors with real 4xx codes.

    ## Field content
    Record field values are keyed by field ID and typed by the `Type` integer. See
    `FieldContent` and the `FieldType` enum for the per-type value shapes.
  contact:
    name: Archer Community (official support)
    url: https://community.archerirm.com/
  license:
    name: Derived documentation; Archer Technologies LLC owns the underlying API documentation.
    url: https://www.archerirm.com/company/terms-of-use
externalDocs:
  description: Archer API Help 2026.08
  url: https://help.archerirm.cloud/api_202608/content/api/archer_apis.htm

servers:
  - url: https://{host}/{instance}
    description: On-premises or hosted Archer instance (instance segment is usually "Archer").
    variables:
      host:
        default: archer.example.com
        description: Archer web server host name.
      instance:
        default: Archer
        description: IIS application name / virtual directory of the Archer web application.

security:
  - ArcherSession: []

tags:
  - name: Authentication
    description: Login / logout (Security controller). Also obtains the session used by the Content API and NGRX.
  - name: Personal Access Tokens
    description: V2 API for creating, rotating and revoking Personal Access Tokens (PATs).
  - name: Content
    description: Record CRUD, history log, reference lookups (Content controller).
  - name: Attachments
    description: Upload and download files from the Archer file repository.
  - name: Deleted Content
    description: V2 audit log of deleted records.
  - name: Workflow
    description: Advanced Workflow actions on a record.
  - name: Data Feed
    description: Execute data feeds and read run history.
  - name: Data Gateway
    description: Manage external data connections, field maps and content maps.
  - name: Metadata - Application
  - name: Metadata - Event
  - name: Metadata - Field
  - name: Metadata - Level
  - name: Metadata - Questionnaire
  - name: Metadata - Security Parameter
  - name: Metadata - Subform
  - name: Metadata - Values List
  - name: Metadata - Selected User Group
  - name: Users
  - name: Groups
  - name: Roles
  - name: Tasks
  - name: Packages
    description: Package automation (create, generate, upload, download, install).
  - name: Access Control Reports
    description: Security Events report and Administration Activity Logs report.
  - name: Smart Data Publications
  - name: Content API
    description: OData v4 translation layer over levels and cross-references (`/contentapi`).
  - name: NGRX
    description: Next Generation Risk Experience API (SaaS only). Full Swagger is served by the tenant at `/ngrx/record/swagger/index.html` (non-production only).

paths:
  # ---------------------------------------------------------------- Authentication
  /platformapi/core/security/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Login (create session)
      description: |
        Creates an Archer session and returns a `SessionToken`. Put it in every later request as
        `Authorization: Archer session-id=<SessionToken>`. If SSO is enabled, "Allow manual bypass"
        must be on in the Archer Control Panel for this call to work (the SOAP
        `general.CreateUserSessionFromInstance` works regardless and its token is accepted here).
        Session lifetime follows the user's security parameter (session timeout).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { InstanceName: "Archer", Username: "apiuser", UserDomain: "", Password: "********" }
      responses:
        "200":
          description: Session created. Also returned (wrapped) as `RequestedObject.SessionToken` on newer builds.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionContext'
                  - allOf:
                      - $ref: '#/components/schemas/ApiResponse'
                      - properties:
                          RequestedObject: { $ref: '#/components/schemas/SessionContext' }
              example: { SessionToken: "C204E18D0ED58E288533F39C455A36E8" }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /platformapi/core/security/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Logout (terminate session)
      description: Terminates the session named in the body. Returns true even if the session is already invalid. Terminating another user's session requires permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Value: { type: string, description: Session token to terminate. }
              required: [Value]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  # ---------------------------------------------------------------- Personal Access Tokens (V2)
  /api/V2/PersonalAccessToken/Create:
    post:
      tags: [Personal Access Tokens]
      operationId: createPersonalAccessToken
      summary: Create PAT
      description: "Administrators can create tokens for any user; others only for themselves. The `Token` value is returned once only. A PAT is used exactly like a session token (`Authorization: Archer session-id=<PAT>`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request: { $ref: '#/components/schemas/PatCreateRequest' }
              required: [request]
            example: { request: { UserId: 123, Name: "My API Token", Description: "Token for automated script", ExpirationDate: "2027-01-31" } }
      responses:
        "200":
          description: Token created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalAccessToken' }
        "400": { $ref: '#/components/responses/V2Error' }
  /api/V2/PersonalAccessToken:
    get:
      tags: [Personal Access Tokens]
      operationId: listPersonalAccessTokens
      summary: Get PATs for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Active tokens (token values are never returned).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PersonalAccessToken' }
  /api/V2/PersonalAccessToken({patId}):
    delete:
      tags: [Personal Access Tokens]
      operationId: revokePersonalAccessToken
      summary: Revoke PAT
      parameters: [ { $ref: '#/components/parameters/patId' } ]
      responses:
        "200": { description: Revoked. }
        "400": { $ref: '#/components/responses/V2Error' }
  /api/V2/PersonalAccessToken({patId})/Rotate:
    post:
      tags: [Personal Access Tokens]
      operationId: rotatePersonalAccessToken
      summary: Rotate PAT by id
      description: Revokes the token and issues a new one for the same user. Body may be empty or carry a new `ExpirationDate`.
      parameters: [ { $ref: '#/components/parameters/patId' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatRotateRequest' }
      responses:
        "200":
          description: New token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalAccessToken' }
  /api/V2/PersonalAccessToken/SelfRotate:
    post:
      tags: [Personal Access Tokens]
      operationId: selfRotatePersonalAccessToken
      summary: Rotate the PAT used for this request
      description: "Authenticate with the PAT to rotate (`Authorization: Archer session-id=<PAT>`); the old token is revoked and a new one returned."
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatRotateRequest' }
      responses:
        "200":
          description: New token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalAccessToken' }

  # ---------------------------------------------------------------- Content
  /platformapi/core/content/contentid:
    get:
      tags: [Content]
      operationId: getContentById
      summary: Get content by ID
      description: "Returns one record (`Content`) with all field contents. Supports `$select` (e.g. `$select=LastUpdated`). Documented as POST + `X-Http-Method-Override: GET`."
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
          description: Content (record) ID.
        - $ref: '#/components/parameters/odataSelect'
        - $ref: '#/components/parameters/methodOverride'
      responses:
        "200":
          description: Record.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      RequestedObject: { $ref: '#/components/schemas/Content' }
  /platformapi/core/content/referencefield/referencefieldid:
    get:
      tags: [Content]
      operationId: getContentByReferenceField
      summary: Get content by reference field ID
      description: |
        For a target-questionnaire cross-reference returns all content in the target application;
        for a regular cross-reference or related-records field returns the record-lookup content.
        Supports `$filter`, `$select`, `$top`, `$skip`, `$orderby` (e.g. `$filter=SequentialId eq 3`).
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
          description: Reference field ID.
        - $ref: '#/components/parameters/odataFilter'
        - $ref: '#/components/parameters/odataSelect'
        - $ref: '#/components/parameters/odataTop'
        - $ref: '#/components/parameters/odataSkip'
        - $ref: '#/components/parameters/odataOrderby'
        - $ref: '#/components/parameters/methodOverride'
      responses:
        "200": { $ref: '#/components/responses/ContentList' }
  /platformapi/core/content/fieldcontent:
    post:
      tags: [Content]
      operationId: getFieldContent
      summary: Get content by content IDs and field IDs
      description: "Returns only the requested fields for the requested records. Must be POST with `X-Http-Method-Override: GET` because the selection travels in the body. OData options go in the query string."
      parameters:
        - $ref: '#/components/parameters/methodOverrideRequired'
        - $ref: '#/components/parameters/odataFilter'
        - $ref: '#/components/parameters/odataSelect'
        - $ref: '#/components/parameters/odataTop'
        - $ref: '#/components/parameters/odataSkip'
        - $ref: '#/components/parameters/odataOrderby'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                FieldIds: { type: array, items: { type: integer } }
                ContentIds: { type: array, items: { type: integer } }
              required: [FieldIds, ContentIds]
            example: { FieldIds: [18503, 18504, 18505], ContentIds: [184630, 184631] }
      responses:
        "200": { $ref: '#/components/responses/ContentList' }
  /platformapi/core/content/history/{contentId}:
    get:
      tags: [Content]
      operationId: getContentHistoryLog
      summary: Expose history log data
      description: Returns the content of every History Log field on the record's application. Empty when no history log field has content.
      x-archer-documented-path: /api/core/content/history/{contentId}
      parameters:
        - $ref: '#/components/parameters/contentIdPath'
        - $ref: '#/components/parameters/methodOverride'
      responses:
        "200":
          description: History log entries (shape varies by field configuration).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /platformapi/core/content:
    post:
      tags: [Content]
      operationId: createContent
      summary: Post content (create record)
      description: |
        Creates a record. `Content.LevelId` identifies the target level; `FieldContents` is keyed by
        field ID. Supply `SubformFieldId` only when saving sub-form content. Using POST on an existing
        record returns 403. Invalid field inputs (bad IP address, nonexistent ContentId in a
        cross-reference) are silently ignored while `IsSuccessful` stays true, so verify after saving.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentWrapper' }
            examples:
              minimal:
                value:
                  Content:
                    LevelId: 9
                    FieldContents:
                      "13867": { Type: 1, Tag: "Name (Text)", Value: "Record created via REST API", FieldId: 13867 }
                      "13890": { Type: 2, Value: 123.456, FieldId: 13890 }
                      "13870": { Type: 4, Value: { ValuesListIds: [63738], OtherText: null }, FieldId: 13870 }
                      "13907": { Type: 9, Value: [ { ContentId: 205522 } ], FieldId: 13907 }
      responses:
        "200": { $ref: '#/components/responses/IdResponse' }
        "403": { description: Attempted to update an existing record with POST. }
    put:
      tags: [Content]
      operationId: updateContent
      summary: Put content (update record)
      description: Updates an existing record identified by `Content.Id`. Only the supplied fields change. Works even when a user has the record locked in the UI. PUT on a nonexistent record returns 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentWrapper' }
            example:
              Content:
                Id: 123
                LevelId: 9
                FieldContents:
                  "3204": { Type: 2, Value: 0.0, FieldId: 3204 }
                  "3202": { Type: 4, Value: { ValuesListIds: [2405], OtherText: null }, FieldId: 3202 }
                  "10066": { Type: 23, Value: [150622], FieldId: 10066 }
      responses:
        "200": { $ref: '#/components/responses/IdResponse' }
        "403": { description: Attempted to insert a new record with PUT. }
  /platformapi/core/content/{contentId}:
    delete:
      tags: [Content]
      operationId: deleteContent
      summary: Delete content by ID
      x-archer-documented-path: /api/core/content/{contentId}
      parameters: [ { $ref: '#/components/parameters/contentIdPath' } ]
      responses:
        "200":
          description: Deleted (RequestedObject is the content ID) or not found (`IsSuccessful:false`, message `ContentSaveNoContentsFound`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      RequestedObject: { type: [integer, "null"] }
  /platformapi/core/content/externalContentChangeNotification:
    put:
      tags: [Content, Data Gateway]
      operationId: notifyExternalContentChange
      summary: Data Gateway change notification
      description: "Lets an external data store tell Archer that mapped external fields changed for the given content IDs; Archer then re-saves the content. Documented with header `X-Http-Method-Override: GET` present."
      parameters: [ { $ref: '#/components/parameters/methodOverride' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Alias: { type: string, description: Connection location alias (e.g. ARCHER). }
                ContentPartIds: { type: array, items: { type: string }, description: Archer content IDs. }
                ExternalFieldIds: { type: array, items: { type: string }, description: External field IDs. }
            example: { Alias: "ARCHER", ContentPartIds: ["234811"], ExternalFieldIds: ["19649"] }
      responses:
        "200":
          description: Validation message reporting success or failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  # ---------------------------------------------------------------- Attachments
  /platformapi/core/content/attachment/{attachmentId}:
    get:
      tags: [Attachments]
      operationId: getAttachment
      summary: Get attachment
      description: Returns an `AttachmentWrapper` with the file name and Base64 bytes; encrypted and unencrypted files are resolved automatically.
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/methodOverride'
      responses:
        "200":
          description: Attachment.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      RequestedObject: { $ref: '#/components/schemas/AttachmentWrapper' }
  /platformapi/core/content/attachment:
    post:
      tags: [Attachments]
      operationId: postAttachmentBytes
      summary: Post attachment from bytes
      description: Uploads a file as Base64. Returns the new attachment ID, which is then referenced from an Attachment (Type 11) or Image (Type 12) field value. `IsSensitive:true` stores the file encrypted; omitted means unencrypted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentWrapper' }
      responses:
        "200": { $ref: '#/components/responses/IdResponse' }
  /platformapi/core/content/multipartattachment:
    post:
      tags: [Attachments]
      operationId: postAttachmentMultipart
      summary: Post attachment from multipart form data
      description: Form parts `AttachmentName`, `AttachmentBytes` (file part; documented as Base64 content) and optional `IsSensitive`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                AttachmentName: { type: string }
                AttachmentBytes: { type: string, format: binary }
                IsSensitive: { type: boolean }
              required: [AttachmentName, AttachmentBytes]
      responses:
        "200": { $ref: '#/components/responses/IdResponse' }

  # ---------------------------------------------------------------- Deleted content (V2)
  /api/V2/DeletedContent:
    get:
      tags: [Deleted Content]
      operationId: listDeletedContent
      summary: Retrieve a log of deleted content
      description: Requires the System Administrator or Deleted Record Auditor role. All parameters optional; `take` defaults to 10000.
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date }, description: "Deleted on/after (yyyy-mm-dd)." }
        - { name: endDate, in: query, schema: { type: string, format: date }, description: "Deleted on/before (yyyy-mm-dd); defaults to today." }
        - { name: moduleid, in: query, schema: { type: integer } }
        - { name: levelid, in: query, schema: { type: integer } }
        - { name: skip, in: query, schema: { type: integer, default: 0 } }
        - { name: take, in: query, schema: { type: integer, default: 10000 } }
      responses:
        "200":
          description: Deleted records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedContentResponse' }
        "400": { $ref: '#/components/responses/V2Error' }

  # ---------------------------------------------------------------- Workflow
  /platformapi/core/system/WorkflowAction/{contentId}:
    get:
      tags: [Workflow]
      operationId: getWorkflowActions
      summary: Get workflow actions
      description: Returns the current workflow node and the transitions (actions) the calling user may perform on the record, each with a `CompletionCode` to feed into Perform Workflow Actions.
      x-archer-documented-path: /api/core/system/WorkflowAction/{contentId}
      parameters:
        - $ref: '#/components/parameters/contentIdPath'
        - $ref: '#/components/parameters/methodOverride'
      responses:
        "200":
          description: Available actions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      RequestedObject: { $ref: '#/components/schemas/WorkflowActions' }
  /platformapi/core/system/WorkflowAction:
    post:
      tags: [Workflow]
      operationId: performWorkflowAction
      summary: Perform workflow action
      description: Commits a transition. Executes regardless of layout rules. Returns `null` with HTTP 200 on success; failures raise an exception / non-200.
      x-archer-documented-path: /api/core/system/WorkflowAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ContentId: { type: integer }
                CompletionCode: { type: integer }
                WorkflowNodeId: { type: string, example: "17604:CUST" }
              required: [ContentId, CompletionCode, WorkflowNodeId]
      responses:
        "200":
          description: Success (body is `null`).
          content:
            application/json:
              schema: { type: "null" }

  # ---------------------------------------------------------------- Data Feed
  /platformapi/core/datafeed/execution:
    post:
      tags: [Data Feed]
      operationId: executeDataFeed
      summary: Execute data feed
      description: Runs the feed identified by GUID. `IsReferenceFeedsIncluded:true` also runs referenced feeds. The user needs rights to run data feeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                DataFeedGuid: { type: string, format: uuid }
                IsReferenceFeedsIncluded: { type: boolean, default: false }
              required: [DataFeedGuid]
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /platformapi/core/datafeed/historymessage/{historyId}:
    get:
      tags: [Data Feed]
      operationId: getDataFeedHistoryMessage
      summary: Get history message for a history ID
      parameters:
        - { name: historyId, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/methodOverride'
      responses:
        "200":
          description: Message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /platformapi/core/datafeed/history/recent:
    post:
      tags: [Data Feed]
      operationId: getDataFeedRecentRun
      summary: Get recent run detail for a data feed
      description: Most recent run (execution time, created/updated/deleted counts, status). Status codes 1 Running, 2 Completed, 3 Faulted, 4 Warning, 5 Terminating, 6 Terminated, 7 Pending.
      parameters: [ { $ref: '#/components/parameters/methodOverrideRequired' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuidBody' }
      responses:
        "200":
          description: Run detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      RequestedObject: { $ref: '#/components/schemas/DataFeedRun' }
  /platformapi/core/datafeed/history:
    post:
      tags: [Data Feed]
      operationId: getDataFeedRunHistory
      summary: Get run history for a data feed
      parameters: [ { $ref: '#/components/parameters/methodOverrideRequired' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuidBody' }
      responses:
        "200":
          description: Run history.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/ApiResponse'
                    - properties:
                        RequestedObject: { $ref: '#/components/schemas/DataFeedRun' }

  # ---------------------------------------------------------------- Data Gateway
  /platformapi/DataGateway/Connections:
    get:
      tags: [Data Gateway]
      operationId: listDataGatewayConnections
      summary: Get connections
      description: Lists connections; filter with `$filter=targetId eq <levelId>`. Requires Data Gateway enabled in the Control Panel and role rights to data gateway.
      parameters: [ { $ref: '#/components/parameters/odataFilter' } ]
      responses:
        "200":
          description: Connections.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      RequestedObject:
                        type: array
                        items: { $ref: '#/components/schemas/DataGatewayConnectionInfo' }
    post:
      tags: [Data Gateway]
      operationId: addDataGatewayConnection
      summary: Add connection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataGatewayConnectionRequest' }
      responses:
        "200":
          description: New connection ID in `RequestedObject`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties: { RequestedObject: { type: integer } }
    put:
      tags: [Data Gateway]
      operationId: editDataGatewayConnection
      summary: Edit connection
      description: Same body as Add plus `Connection.Id`; `LocationAlias` and `TargetId` are ignored on edit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataGatewayConnectionRequest' }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    delete:
      tags: [Data Gateway]
      operationId: deleteDataGatewayConnection
      summary: Delete connection (async)
      description: Removes the connection and resets its field maps and content maps; affected Archer fields become blank. Returns a job ID for the asynchronous job.
      parameters: [ { $ref: '#/components/parameters/connectionAlias' } ]
      responses:
        "200": { $ref: '#/components/responses/JobResponse' }
  /platformapi/DataGateway/Connections/Test:
    post:
      tags: [Data Gateway]
      operationId: testDataGatewayConnection
      summary: Test connection
      description: Tests connector settings (the Flexible SQL Connector supports this; custom connectors must implement it). `RequestedObject` is true/false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataGatewayConnector' }
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties: { RequestedObject: { type: boolean } }
  /platformapi/DataGateway/FieldMaps:
    get:
      tags: [Data Gateway]
      operationId: listDataGatewayFieldMaps
      summary: Get field maps
      description: |
        Filter examples (URL-encode spaces/quotes):
        `$filter=DataGatewayFieldMaps/any(dgfm:dgfm/Connections/any(conn:conn/Name eq 'SQLCON1'))`,
        `$filter=DataGatewayFieldMaps/any(dgfm:dgfm/targetId eq 335)`.
      parameters: [ { $ref: '#/components/parameters/odataFilter' } ]
      responses:
        "200":
          description: Field maps grouped by module and level.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      RequestedObject:
                        type: array
                        items: { $ref: '#/components/schemas/DataGatewayModuleFieldMaps' }
    put:
      tags: [Data Gateway]
      operationId: putDataGatewayFieldMaps
      summary: Add/edit field maps (or revert)
      description: PUT and POST behave the same here. Supplying `SourceFieldId` maps an external column to an Archer field; omitting it (connection name `ARCHER`) reverts the field to native Archer storage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataGatewayFieldMapRequest' }
      responses:
        "200": { $ref: '#/components/responses/ProcessedIdsResponse' }
    post:
      tags: [Data Gateway]
      operationId: postDataGatewayFieldMaps
      summary: Add/edit field maps (or revert), POST form
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataGatewayFieldMapRequest' }
      responses:
        "200": { $ref: '#/components/responses/ProcessedIdsResponse' }
  /platformapi/DataGateway/ContentMaps:
    get:
      tags: [Data Gateway]
      operationId: listDataGatewayContentMaps
      summary: Get content maps
      description: Returns the first 100 content maps for the connection by default; `$top` max 1000, `$skip` default 0.
      parameters:
        - $ref: '#/components/parameters/connectionAlias'
        - $ref: '#/components/parameters/odataTop'
        - $ref: '#/components/parameters/odataSkip'
      responses:
        "200":
          description: Content maps.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      RequestedObject: { $ref: '#/components/schemas/DataGatewayContentMaps' }
    put:
      tags: [Data Gateway]
      operationId: putDataGatewayContentMaps
      summary: Add/edit content maps
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataGatewayContentMaps' }
      responses:
        "200": { $ref: '#/components/responses/ProcessedIdsResponse' }
    post:
      tags: [Data Gateway]
      operationId: postDataGatewayContentMaps
      summary: Add/edit content maps, POST form
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataGatewayContentMaps' }
      responses:
        "200": { $ref: '#/components/responses/ProcessedIdsResponse' }
  /platformapi/DataGateway/ContentMaps/Delete:
    delete:
      tags: [Data Gateway]
      operationId: deleteDataGatewayContentMapsByContent
      summary: Delete content maps by connection and content ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                LocationAlias: { type: string, maxLength: 10 }
                ContentMaps:
                  type: array
                  items:
                    type: object
                    properties: { TrackingId: { type: integer } }
      responses:
        "200": { $ref: '#/components/responses/ProcessedIdsResponse' }
  /platformapi/DataGateway/ContentMaps/DeleteAll:
    delete:
      tags: [Data Gateway]
      operationId: deleteDataGatewayContentMapsByConnection
      summary: Delete all content maps for a connection (async)
      parameters: [ { $ref: '#/components/parameters/connectionAlias' } ]
      responses:
        "200": { $ref: '#/components/responses/JobResponse' }

