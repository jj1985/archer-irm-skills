          application/json:
            schema:
              type: object
              properties: { UserId: { type: integer }, GroupId: { type: integer }, IsAdd: { type: boolean, description: true adds, false removes } }
              required: [UserId, GroupId, IsAdd]
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
  /platformapi/core/system/userrole:
    put:
      tags: [Users, Roles]
      operationId: setUserRoleMembership
      summary: Add user to / remove user from access role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { UserId: { type: integer }, RoleId: { type: integer }, IsAdd: { type: boolean } }
              required: [UserId, RoleId, IsAdd]
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
  /platformapi/core/system/usercontact:
    get:
      tags: [Users]
      operationId: listUserContacts
      summary: Get all user contacts
      responses:
        "200":
          description: Contacts per user.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/ApiResponse'
                    - properties:
                        RequestedObject:
                          type: object
                          properties:
                            UserId: { type: integer }
                            Contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }
  /platformapi/core/system/usercontact/{userId}:
    get:
      tags: [Users]
      operationId: getUserContacts
      summary: Get contact information for a user
      parameters: [ { $ref: '#/components/parameters/userId' } ]
      responses:
        "200":
          description: Contacts.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/ApiResponse'
                    - properties: { RequestedObject: { $ref: '#/components/schemas/Contact' } }
  /platformapi/core/system/task:
    post:
      tags: [Tasks]
      operationId: getUserTasks
      summary: Get tasks assigned to the current user
      description: POST + override with an OData body; `$filter` is supported only on `IsComplete`.
      parameters: [ { $ref: '#/components/parameters/methodOverrideRequired' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ODataQueryBody' }
            example: { Value: "?$skip=0&$top=25&$filter=IsComplete eq false" }
      responses:
        "200":
          description: Tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/ApiResponse'
                    - properties: { RequestedObject: { $ref: '#/components/schemas/Task' } }

  # ---------------------------------------------------------------- Groups
  /platformapi/core/system/group:
    get:
      tags: [Groups]
      operationId: listGroups
      summary: Get all groups
      parameters: [ { $ref: '#/components/parameters/odataFilter' }, { $ref: '#/components/parameters/odataSelect' }, { $ref: '#/components/parameters/methodOverride' } ]
      responses: { "200": { $ref: '#/components/responses/GroupList' } }
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Create group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupWrapper' }
            example: { Group: { Name: "GroupA", Description: "Group A description" }, ParentGroups: [1], ChildGroups: [2], ChildUsers: null }
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
    put:
      tags: [Groups]
      operationId: updateGroup
      summary: Update group
      description: "`Group.Id` and `Group.Name` required. `ParentGroups`/`ChildGroups`/`ChildUsers`: null leaves unchanged, list replaces."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupWrapper' }
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
  /platformapi/core/system/group/{groupId}:
    get:
      tags: [Groups]
      operationId: getGroup
      summary: Get group by ID
      parameters: [ { $ref: '#/components/parameters/groupId' } ]
      responses: { "200": { $ref: '#/components/responses/GroupSingle' } }
    delete:
      tags: [Groups]
      operationId: deleteGroup
      summary: Delete group
      parameters: [ { $ref: '#/components/parameters/groupId' } ]
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
  /platformapi/core/system/group/user/{userId}:
    get:
      tags: [Groups]
      operationId: getGroupsByUser
      summary: Get groups of which a user is a member
      parameters: [ { $ref: '#/components/parameters/userId' }, { $ref: '#/components/parameters/methodOverride' } ]
      responses: { "200": { $ref: '#/components/responses/GroupList' } }
  /platformapi/core/system/grouphierarchy:
    get:
      tags: [Groups]
      operationId: getGroupHierarchy
      summary: Get group hierarchy
      description: Each record is (Id, RelatedId = ancestor group, Generation = distance; 0 for itself, 1 for immediate parent).
      responses:
        "200":
          description: Hierarchy records.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/ApiResponse'
                    - properties:
                        RequestedObject:
                          type: object
                          properties: { Id: { type: integer }, RelatedId: { type: integer }, Generation: { type: integer } }
  /platformapi/core/system/groupmembership:
    get:
      tags: [Groups]
      operationId: getGroupMemberships
      summary: Get all group memberships (users and parent groups per group)
      responses:
        "200":
          description: Memberships.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/ApiResponse'
                    - properties:
                        RequestedObject:
                          type: object
                          properties:
                            GroupId: { type: integer }
                            UserIds: { type: [array, "null"], items: { type: integer } }
                            ParentGroupIds: { type: [array, "null"], items: { type: integer } }
  /platformapi/core/system/groupmember:
    put:
      tags: [Groups]
      operationId: setGroupMember
      summary: Add child group to / remove from parent group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { GroupId: { type: integer, description: Parent group }, GroupMemberId: { type: integer, description: Child group }, IsAdd: { type: boolean } }
              required: [GroupId, GroupMemberId, IsAdd]
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
  /platformapi/core/system/rolegroup:
    put:
      tags: [Groups, Roles]
      operationId: setGroupRoleMembership
      summary: Add group to / remove group from access role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { GroupId: { type: integer }, RoleId: { type: integer }, IsAdd: { type: boolean } }
              required: [GroupId, RoleId, IsAdd]
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }

  # ---------------------------------------------------------------- Roles
  /platformapi/core/system/role:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: Get all access roles
      responses: { "200": { $ref: '#/components/responses/RoleList' } }
    post:
      tags: [Roles]
      operationId: createRole
      summary: Create access role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleWrapper' }
            example: { AccessRole: { Name: "RoleA", Description: "This is a test role", IsDefault: false }, GroupIds: [1, 2], AccessRoleTasks: null }
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
    put:
      tags: [Roles]
      operationId: updateRole
      summary: Update access role
      description: "`AccessRole.Id`, `Name` and `Alias` required. `GroupIds` null/empty unassigns all groups. `AccessRoleTasks` null leaves permissions unchanged. Warning: the request clears the role's Default Home Page settings."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleWrapper' }
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
  /platformapi/core/system/role/{roleId}:
    delete:
      tags: [Roles]
      operationId: deleteRole
      summary: Delete access role
      parameters: [ { name: roleId, in: path, required: true, schema: { type: integer } } ]
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
  /platformapi/core/system/role/user/{userId}:
    get:
      tags: [Roles]
      operationId: getRolesByUser
      summary: Get roles for a user
      parameters: [ { $ref: '#/components/parameters/userId' } ]
      responses: { "200": { $ref: '#/components/responses/RoleList' } }
  /platformapi/core/system/rolemembership:
    get:
      tags: [Roles]
      operationId: getRoleMemberships
      summary: Get role memberships (users and groups per role)
      responses: { "200": { $ref: '#/components/responses/GenericList' } }

  # ---------------------------------------------------------------- Packages
  /platformapi/core/package:
    post:
      tags: [Packages]
      operationId: createPackage
      summary: Create package
      x-archer-documented-path: /api/core/package/
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackageCreateRequest' }
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
  /platformapi/core/package/generate/{packageId}:
    post:
      tags: [Packages]
      operationId: generatePackage
      summary: Generate package file
      x-archer-documented-path: /api/core/package/generate/{packageId}
      parameters: [ { $ref: '#/components/parameters/packageId' } ]
      responses: { "200": { $ref: '#/components/responses/GenericObject' } }
  /platformapi/core/package/install:
    post:
      tags: [Packages]
      operationId: installPackage
      summary: Install package
      description: Copy the exact body from the Import and Install Packages page in the UI, which fills in object GUIDs and install options.
      x-archer-documented-path: /api/core/package/install
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackageInstallRequest' }
      responses: { "200": { $ref: '#/components/responses/GenericObject' } }
  /platformapi/core/package/upload:
    post:
      tags: [Packages]
      operationId: uploadPackage
      summary: Upload package (.zip)
      x-archer-documented-path: /api/core/package/upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: The package zip (any part name). }
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
  /platformapi/core/package/download/{packageId}:
    get:
      tags: [Packages]
      operationId: downloadPackage
      summary: Download package (.zip)
      x-archer-documented-path: /api/core/package/download/{packageId}
      parameters: [ { $ref: '#/components/parameters/packageId' } ]
      responses:
        "200":
          description: Package file.
          content:
            application/zip:
              schema: { type: string, format: binary }

  # ---------------------------------------------------------------- Access Control reports
  /platformapi/core/system/AccessControlReports/SecurityEvents:
    post:
      tags: [Access Control Reports]
      operationId: getSecurityEvents
      summary: Security Events Report
      description: Up to 50,000 events per page for one day; `EventsForDate` must be 1 to 6 days before today. Requires read rights to the Security Events report. See the skill reference for the full list of event types.
      x-archer-documented-path: /api/core/system/AccessControlReports/SecurityEvents
      parameters:
        - $ref: '#/components/parameters/methodOverrideRequired'
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                InstanceName: { type: string }
                EventType: { type: string, example: "All Events" }
                EventsForDate: { type: string, format: date }
              required: [InstanceName, EventType, EventsForDate]
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      RequestedObject:
                        type: array
                        items: { $ref: '#/components/schemas/SecurityEvent' }
  /platformapi/core/system/AdministrationActivityLogsReports/AdministrationActivityLogsReport:
    post:
      tags: [Access Control Reports]
      operationId: getAdministrationActivityLogs
      summary: Field Administration Activity Logs Report
      description: Up to 50,000 records per page. The documentation also shows the resource name `FieldAdministrationActivityLogsReport`; try it if this one returns 404.
      x-archer-documented-path: /api/core/system/AdministrationActivityLogsReports/AdministrationActivityLogsReport/
      parameters:
        - $ref: '#/components/parameters/methodOverrideRequired'
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                InitiatingUserId: { type: integer }
                ActionsForDate: { type: string, format: date }
                ApplicationId: { type: integer }
                ActionType: { type: string, example: "Field Creation" }
              required: [InitiatingUserId, ActionsForDate, ApplicationId, ActionType]
      responses:
        "200":
          description: Log entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdministrationActivityLog' }

  # ---------------------------------------------------------------- Smart Data Publications
  /platformapi/core/smartdatapublication/download/{sdpId}:
    get:
      tags: [Smart Data Publications]
      operationId: downloadSmartDataPublication
      summary: Download exported ZIP for a Smart Data Publication
      description: "Streams the export ZIP. Response headers `Content-Disposition` (file name) and `zip-crc` (CRC for integrity check). Requires Manage Smart Data Publication rights. Send `Accept: application/octet-stream`."
      x-archer-documented-path: /api/core/smartdatapublication/download/{sdpId}
      parameters: [ { name: sdpId, in: path, required: true, schema: { type: integer } } ]
      responses:
        "200":
          description: ZIP stream.
          headers:
            Content-Disposition: { schema: { type: string } }
            zip-crc: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { description: Bad request. }
        "500": { description: Could not download exported files. }

  # ---------------------------------------------------------------- Content API (OData)
  /contentapi/:
    get:
      tags: [Content API]
      operationId: contentApiGetEndpoints
      summary: Get endpoints (entity sets)
      description: Lists every level and cross-reference relationship the user can read, as OData entity sets. Level aliases are case-sensitive; when two levels share an alias the entity set is `ModuleAlias_LevelAlias`.
      security:
        - ArcherSession: []
        - ArcherSessionCookie: []
      responses:
        "200":
          description: Service document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ODataServiceDocument' }
  /contentapi/$metadata:
    get:
      tags: [Content API]
      operationId: contentApiGetMetadata
      summary: OData CSDL metadata ($metadata)
      description: Standard OData v4 metadata document describing every entity set and its properties (field aliases and types).
      responses:
        "200":
          description: CSDL XML.
          content:
            application/xml:
              schema: { type: string }
  /contentapi/{levelAlias}:
    get:
      tags: [Content API]
      operationId: contentApiListRecords
      summary: Get level content (records by field alias)
      description: |
        Returns up to 1,000 records per page as flat JSON keyed by field alias. Paging: `?skip=N`
        (N in records; documented as "thousands" for raw paging) and `?top=N` or `?top=all`; the
        standard OData forms `$top`, `$skip`, `$filter`, `$select`, `$orderby` are also accepted
        (`skip=10&$top=20` is shown in the documentation). Values lists come back as arrays of
        value text; references as arrays of IDs; users/groups as objects.
      parameters:
        - $ref: '#/components/parameters/levelAlias'
        - { name: skip, in: query, schema: { type: integer }, description: Records to skip. }
        - { name: top, in: query, schema: { type: string }, description: "Number of records, or `all`." }
        - $ref: '#/components/parameters/odataFilter'
        - $ref: '#/components/parameters/odataSelect'
        - $ref: '#/components/parameters/odataOrderby'
        - $ref: '#/components/parameters/odataTop'
        - $ref: '#/components/parameters/odataSkip'
      responses:
        "200":
          description: Records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ODataCollection' }
    post:
      tags: [Content API]
      operationId: contentApiSaveRecord
      summary: Content Save (create or update a record)
      description: |
        Body is a flat object keyed by field alias. The `<LevelAlias>_Id` property set to `0` creates a
        record; any other value updates that record. Supported field types: Text, Numeric, Date,
        Values List (`{"ValuesListIds":[...]}`), User/Groups List and Record Permissions
        (`{"UserList":[{"Id":n}],"GroupList":[{"Id":n}]}`), Cross-Reference / Related Records (array of
        content IDs), Sub-Form, IP Address, First Published, Last Updated. Updating a record with values
        identical to its current values fails with HTTP 400. Returns HTTP 200 with an empty body.
      parameters: [ { $ref: '#/components/parameters/levelAlias' } ]
      security:
        - ArcherSession: []
        - ArcherSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              Exception_Requests_Id: 0
              Risk_Rating: { ValuesListIds: [1199] }
              Submitter: { UserList: [ { Id: 2 } ] }
              Submission_Due_Date: "07/07/2018"
              Exception_Description: "This is an exception description"
              Business_Unit: [226446]
      responses:
        "200": { description: Saved. }
        "400": { description: Validation failure (including no-op update with identical values). }
  /contentapi/{levelAlias}({trackingId}):
    get:
      tags: [Content API]
      operationId: contentApiGetRecord
      summary: Get a single record by tracking ID
      parameters:
        - $ref: '#/components/parameters/levelAlias'
        - { name: trackingId, in: path, required: true, schema: { type: integer }, description: Record (content) ID; must be in parentheses in the URL. }
      responses:
        "200":
          description: Record.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /contentapi/{levelAlias}_{fieldAlias}:
    get:
      tags: [Content API]
      operationId: contentApiGetRelationships
      summary: Get cross-reference / related-records relationships
      description: Entity set named `<LevelAlias>_<FieldAlias>` returning pairs of `<Level>_Id` values for every linked record pair (e.g. `Incidents_Id`, `Risk_Register_Id`).
      parameters:
        - $ref: '#/components/parameters/levelAlias'
        - { name: fieldAlias, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Relationship pairs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ODataCollection' }

  # ---------------------------------------------------------------- NGRX (SaaS only)
  /ngrx/record/v1/levels/{levelId}:
    get:
      tags: [NGRX]
      operationId: ngrxGetLevel
      summary: NGRX level (documented JWT bootstrap example)
      description: |
        The only NGRX call shown in the public help. Send `cookie: __ArcherSessionCookie__=<session token or PAT>`;
        the response carries a `Set-Cookie` with a JWT that should be reused on subsequent NGRX calls
        for best performance. The full NGRX surface is documented per tenant at
        `/ngrx/record/swagger/index.html` (non-production environments only).
      security:
        - NgrxSessionCookie: []
        - NgrxJwtCookie: []
      parameters: [ { $ref: '#/components/parameters/levelId' } ]
      responses:
        "200":
          description: Level definition.
          headers:
            Set-Cookie: { schema: { type: string }, description: JWT cookie to reuse. }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

components:
  securitySchemes:
    ArcherSession:
      type: apiKey
      in: header
      name: Authorization
      description: "`Authorization: Archer session-id=<SessionToken or PAT>` (the custom `Archer` scheme, not Bearer)."
    ArcherSessionCookie:
      type: apiKey
      in: cookie
      name: ArcherSessionCookie
      description: Alternative for the Content API; value is the session token.
    NgrxSessionCookie:
      type: apiKey
      in: cookie
      name: __ArcherSessionCookie__
      description: Archer session token or PAT for the first NGRX call.
    NgrxJwtCookie:
      type: apiKey
      in: cookie
      name: jwt
      description: The JWT cookie returned by the first NGRX call (actual cookie name is given by Set-Cookie).

  parameters:
    methodOverride:
      name: X-Http-Method-Override
      in: header
      required: false
      schema: { type: string, enum: [GET] }
      description: Send the request as POST with this header set to GET to keep OData options out of the URL (body `{"Value":"?$select=..."}`).
    methodOverrideRequired:
      name: X-Http-Method-Override
      in: header
      required: true
      schema: { type: string, enum: [GET] }
      description: Required; the request is a read sent as POST.
    odataFilter: { name: $filter, in: query, required: false, schema: { type: string }, description: "OData filter, e.g. `SequentialId eq 3`, `Name eq 'Policies'`." }
    odataSelect: { name: $select, in: query, required: false, schema: { type: string }, description: "Comma-separated properties to project." }
    odataTop: { name: $top, in: query, required: false, schema: { type: integer } }
    odataSkip: { name: $skip, in: query, required: false, schema: { type: integer } }
    odataOrderby: { name: $orderby, in: query, required: false, schema: { type: string }, description: "`Property [asc|desc]`." }
    contentIdPath: { name: contentId, in: path, required: true, schema: { type: integer } }
    applicationId: { name: applicationId, in: path, required: true, schema: { type: integer } }
    levelId: { name: levelId, in: path, required: true, schema: { type: integer } }
    fieldId: { name: fieldId, in: path, required: true, schema: { type: integer } }
    userId: { name: userId, in: path, required: true, schema: { type: integer } }
    groupId: { name: groupId, in: path, required: true, schema: { type: integer } }
    valuesListId: { name: valuesListId, in: path, required: true, schema: { type: integer } }
    securityParameterId: { name: securityParameterId, in: path, required: true, schema: { type: integer } }
    packageId: { name: packageId, in: path, required: true, schema: { type: integer } }
    patId: { name: patId, in: path, required: true, schema: { type: integer } }
    levelAlias: { name: levelAlias, in: path, required: true, schema: { type: string }, description: "Entity set name from Get Endpoints (case-sensitive)." }
    connectionAlias: { name: connection, in: query, required: true, schema: { type: string, maxLength: 10 }, description: Connection LocationAlias. }

  responses:
    Unauthorized: { description: Invalid credentials or session. }
    V2Error:
      description: OData-style error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/V2ErrorResponse' }
    IdResponse:
      description: Success envelope whose `RequestedObject.Id` is the affected object's ID.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - properties:
                  RequestedObject:
                    type: object
                    properties: { Id: { type: integer } }
    JobResponse:
      description: Asynchronous job queued.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - properties:
                  RequestedObject:
                    type: object
                    properties: { JobId: { type: string, format: uuid } }
    ProcessedIdsResponse:
      description: Processed and rejected IDs (partial success sets `IsSuccessful:false` with validation messages).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - properties:
                  RequestedObject:
                    type: object
                    properties:
                      ProcessedIds: { type: array, items: { type: integer } }
                      RejectedIds: { type: [array, "null"], items: { type: integer } }
    GenericObject:
      description: Single object envelope (shape not detailed in the documentation).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    GenericList:
      description: Array of envelopes (shape not detailed in the documentation).
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/ApiResponse' }
    ContentList:
      description: Array of record envelopes.
      content:
        application/json:
          schema:
            type: array
            items:
              allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - properties: { RequestedObject: { $ref: '#/components/schemas/Content' } }
    ApplicationList:
      description: Applications.
      content:
        application/json:
          schema:
            type: array
            items:
              allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - properties: { RequestedObject: { $ref: '#/components/schemas/Application' } }
    ApplicationSingle:
      description: Application.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - properties: { RequestedObject: { $ref: '#/components/schemas/Application' } }
    FieldDefinitionList:
      description: Field definitions.
      content:
        application/json:
          schema:
            type: array
            items:
              allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - properties: { RequestedObject: { $ref: '#/components/schemas/FieldDefinition' } }
    FieldDefinitionSingle:
      description: Field definition.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - properties: { RequestedObject: { $ref: '#/components/schemas/FieldDefinition' } }
    LevelList:
      description: Levels.
      content:
        application/json:
          schema:
            type: array
            items:
              allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - properties: { RequestedObject: { $ref: '#/components/schemas/Level' } }
    LevelSingle:
      description: Level.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - properties: { RequestedObject: { $ref: '#/components/schemas/Level' } }
    SecurityParameterList:
      description: Security parameters.
      content:
        application/json:
          schema:
            type: array
            items:
              allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - properties: { RequestedObject: { $ref: '#/components/schemas/SecurityParameter' } }
    SecurityParameterSingle:
      description: Security parameter.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - properties: { RequestedObject: { $ref: '#/components/schemas/SecurityParameter' } }
    ValuesListValueList:
      description: Values list values.
      content:
        application/json:
          schema:
            type: array
            items:
              allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - properties: { RequestedObject: { $ref: '#/components/schemas/ValuesListValue' } }
    UserList:
      description: Users.
      content:
        application/json:
          schema:
            type: array
            items:
              allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - properties: { RequestedObject: { $ref: '#/components/schemas/User' } }
    UserSingle:
      description: User.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - properties: { RequestedObject: { $ref: '#/components/schemas/User' } }
    GroupList:
      description: Groups.
      content:
        application/json:
          schema:
            type: array
            items:
              allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - properties: { RequestedObject: { $ref: '#/components/schemas/Group' } }
    GroupSingle:
      description: Group.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - properties: { RequestedObject: { $ref: '#/components/schemas/Group' } }
    RoleList:
      description: Roles.
      content:
        application/json:
          schema:
            type: array
            items:
              allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - properties: { RequestedObject: { $ref: '#/components/schemas/AccessRole' } }

  schemas:
    # ---- envelope
    ApiResponse:
      type: object
      description: Standard Platform API envelope. Check `IsSuccessful`; HTTP 200 does not imply success.
      properties:
        Links: { type: array, items: { type: object } }
        RequestedObject: { description: The payload; type varies per operation. }
        IsSuccessful: { type: boolean }
        ValidationMessages:
          type: [array, "null"]
          items: { $ref: '#/components/schemas/ValidationMessage' }
    ValidationMessage:
      type: object
      properties:
        Reason: { type: string }
        Severity: { type: integer, description: "Observed: 2 warning/partial, 3 error, 4 not found." }
        MessageKey: { type: string, example: "ValidationMessageTemplates:ContentSaveNoContentsFound" }
        Description: { type: string }
        Location: { type: integer }
        ErroredValue: { type: [string, "null"] }
        Validator: { type: string }
        XmlData: { type: [string, "null"] }
        ResourcedMessage: { type: string }
        ContentIndex: { type: integer }
        ConflictContent: { type: [object, "null"] }
    V2ErrorResponse:
      type: object
      properties:
        "@odata.context": { type: string }
        "@odata.type": { type: string, example: "#ArcherTech.Web.Api.V2.OData.Error.CustomErrorResponse" }
        HttpStatus: { type: integer }
        InternalMessage: { type: string }
        Type: { type: string, example: Warning }
        ValidationErrors: { type: array, items: { type: object } }
        Metadata: { type: [object, "null"] }
    ODataQueryBody:
      type: object
      description: Body form of OData options for POST + X-Http-Method-Override reads.
      properties:
        Value: { type: string, example: "?$top=50&$skip=100&$select=Name,Description&$orderby=Name desc" }
    GuidBody:
      type: object
      properties: { Guid: { type: string, format: uuid } }
      required: [Guid]
    UpdateInformation:
      type: object
      properties:
        CreateDate: { type: [string, "null"], format: date-time }
        UpdateDate: { type: [string, "null"], format: date-time }
        CreateLogin: { type: [integer, "null"] }
        UpdateLogin: { type: [integer, "null"] }

    # ---- auth
    LoginRequest:
      type: object
      properties:
        InstanceName: { type: string, description: Archer instance name (Control Panel). }
        Username: { type: string }
        UserDomain: { type: string, description: Empty for non-domain users. }
        Password: { type: string, format: password }
      required: [InstanceName, Username, Password]
    SessionContext:
      type: object
      properties:
        SessionToken: { type: string, description: 32-char hex token. }
    PatCreateRequest:
      type: object
      properties:
        UserId: { type: integer }
        Name: { type: string }
        Description: { type: string }
        ExpirationDate: { type: string, format: date, description: "yyyy-MM-dd, 1 day to 1 year ahead." }
      required: [UserId, Name, ExpirationDate]
    PatRotateRequest:
      type: object
      properties:
        expirationDate: { type: string, format: date, description: Optional new expiry (yyyy-MM-dd). }
    PersonalAccessToken:
      type: object
      properties:
        Token: { type: string, description: Present only on create/rotate responses. }
        Id: { type: integer }
        IsRevoked: { type: boolean }
        UserId: { type: integer }
        ExpirationDate: { type: string }
        Name: { type: string }
        Description: { type: string }
        CreateDate: { type: string, format: date-time }

    # ---- content
    FieldType:
      type: integer
      description: |
        Field type IDs used in `FieldContent.Type` and `FieldDefinition.Type`.
        1 Text, 2 Numeric, 3 Date, 4 Values List, 6 Tracking ID, 7 External Links, 8 Users/Groups List
        (also Record Permissions), 9 Cross-Reference, 11 Attachment, 12 Image, 14 CAST, 16 Matrix,
        19 IP Address, 20 Record Status, 21 First Published, 22 Last Updated, 23 Related Records,
        24 Sub-Form, 25 History Log, 27 Multiple Reference Display Control, 28 Questionnaire Reference,
        29 Access History, 30 Voting, 31 Scheduler, 1001 CAST Field Value.
        Writable via Post/Put content: 1, 2, 3, 4, 7, 8, 9, 11, 12, 16, 19, 23, 24.
      enum: [1, 2, 3, 4, 6, 7, 8, 9, 11, 12, 14, 16, 19, 20, 21, 22, 23, 24, 25, 27, 28, 29, 30, 31, 1001]
    ContentWrapper:
      type: object
      properties:
        Content: { $ref: '#/components/schemas/Content' }
        SubformFieldId: { type: integer, description: Only when saving sub-form content. }
      required: [Content]
    Content:
      type: object
      properties:
        Id: { type: integer, description: Content ID (omit on create). }
        LevelId: { type: integer }
        SequentialId: { type: integer, readOnly: true }
        FieldContents:
          type: object
          description: Keyed by field ID (as string).
          additionalProperties: { $ref: '#/components/schemas/FieldContent' }
        Version: { type: [string, integer, "null"] }
        CheckSum: { type: [string, "null"], readOnly: true }
        LastUpdated: { type: string, format: date-time, readOnly: true }
        Identity: { type: object, readOnly: true, description: BaseContentId and data-gateway Locators. }
        UpdateInformation: { $ref: '#/components/schemas/UpdateInformation' }
      required: [LevelId, FieldContents]
    FieldContent:
      type: object
      description: |
        One field value. `Value` shape depends on `Type`:
        1 string (plain or HTML) · 2 number · 3 date string ("2016-12-14", "2014-03-06T21:30:00",
        "10/21/1956 11:59AM"; "0" = null) · 4 `{ValuesListIds:[int], OtherText}` (`{0}` = null) ·
        7 `[{Name, Url}]` · 8 `{UserList:[{Id}], GroupList:[{Id}]}` · 9 `[{ContentId}]` ·
        11/12 `[attachmentId]` · 16 `[{RowId, ColumnId}]` · 19 no Value: `IpAddressBytes:"127.0.0.1"`
        (no extra properties allowed) · 23 `[contentId]` · 24 `[subformContentId]`.
        `Tag` is an optional free-text label ignored by the server (do not use with Type 19).
        Omitting a field leaves it unchanged (or null on create). Responses add `IsError` and
        `UpdateInformation`.
      properties:
        Type: { $ref: '#/components/schemas/FieldType' }
        FieldId: { type: integer }
        Tag: { type: string }
        Value:
          oneOf:
            - { type: string }
            - { type: number }
            - { $ref: '#/components/schemas/ValuesListValueInput' }
            - { type: array, items: { $ref: '#/components/schemas/ExternalLink' } }
            - { $ref: '#/components/schemas/UsersGroupsValue' }
            - { type: array, items: { type: object, properties: { ContentId: { type: integer } } } }
            - { type: array, items: { type: integer } }
            - { type: array, items: { type: object, properties: { RowId: { type: integer }, ColumnId: { type: integer } } } }
            - { type: "null" }
        IpAddressBytes: { type: string, description: Type 19 only. }
        IsError: { type: boolean, readOnly: true }
        UpdateInformation: { $ref: '#/components/schemas/UpdateInformation' }
      required: [Type, FieldId]
    ValuesListValueInput:
      type: object
      properties:
        ValuesListIds: { type: array, items: { type: integer } }
        OtherText: { type: [string, "null"] }
    ExternalLink:
      type: object
      properties: { Name: { type: string }, Url: { type: string } }
    UsersGroupsValue:
      type: object
      properties:
        UserList: { type: [array, "null"], items: { type: object, properties: { Id: { type: integer } } } }
        GroupList: { type: [array, "null"], items: { type: object, properties: { Id: { type: integer } } } }
    AttachmentWrapper:
      type: object
      properties:
        AttachmentName: { type: string }
        AttachmentBytes: { type: string, format: byte, description: Base64 file contents. }
        IsSensitive: { type: boolean, description: true = store encrypted. }
      required: [AttachmentName, AttachmentBytes]
    DeletedContentResponse:
      type: object
      properties:
        TotalRecords: { type: integer }
        RecordsShown: { type: integer }
        DeletedContents:
          type: array
          items:
            type: object
            properties:
              ContentId: { type: integer }
              DeletedDateTime: { type: string, format: date-time }
              UserId: { type: integer }
              ModuleId: { type: integer }
              LevelId: { type: integer }
    WorkflowActions:
      type: object
      properties:
        WorkflowNodeId: { type: string, example: "18304:CUST" }
        WorkflowNodeName: { type: string }
        JobStatus: { type: string, example: Running }
        Actions:
          type: array
          items:
            type: object
            properties:
              WorkflowTransitionId: { type: string }
              WorkflowTransitionName: { type: string }
              CompletionCode: { type: integer }
    DataFeedRun:
      type: object
      description: Run history record (property names per documentation prose; verify against your instance).
      properties:
        Status: { type: integer, description: 1 Running, 2 Completed, 3 Faulted, 4 Warning, 5 Terminating, 6 Terminated, 7 Pending. }
      additionalProperties: true

    # ---- data gateway
    DataGatewayConnector:
      type: object
      properties:
        ConnectorType: { type: string, example: ArcherTech.Datasource.Content.GenericSql.GenericSqlDataSource }
        Properties:
          type: array
          description: Connector-specific name/value pairs (Flexible SQL Connector uses dbProviderType, connectionString, tableName, idColumnName, idColumnType).
          items:
            type: object
            properties: { Name: { type: string }, Value: { type: string } }
    DataGatewayConnectionRequest:
      type: object
      properties:
        TargetId: { type: integer, description: Level ID. }
        Connection:
          type: object
          properties:
            Id: { type: integer, description: Required on edit. }
            LocationAlias: { type: string, maxLength: 10 }
            DatagatewayConnector: { $ref: '#/components/schemas/DataGatewayConnector' }
    DataGatewayConnectionInfo:
      type: object
      properties:
        TargetId: { type: integer }
        TargetName: { type: string }
        Connection:
          type: object
          properties:
            Id: { type: integer }
            LocationAlias: { type: string }
            LastUpdated: { type: string, format: date-time }
            DatagatewayConnector: { $ref: '#/components/schemas/DataGatewayConnector' }
    DataGatewayFieldMapRequest:
      type: object
      properties:
        TargetId: { type: integer }
        Connections:
          type: array
          items:
            type: object
            properties:
              Name: { type: string, maxLength: 10 }
              FieldMapping:
                type: array
                items:
                  type: object
                  properties:
                    SourceFieldId: { type: string, maxLength: 256, description: Omit to revert the field to Archer storage. }
                    ArcherFieldId: { type: integer }
    DataGatewayModuleFieldMaps:
      type: object
      properties:
        ModuleId: { type: integer }
        ModuleName: { type: string }
        DataGatewayFieldMaps:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/DataGatewayFieldMapRequest'
              - properties: { TargetName: { type: string } }
    DataGatewayContentMaps:
      type: object
      properties:
        TargetId: { type: integer }
        LocationAlias: { type: string, maxLength: 10 }
        ContentMaps:
          type: array
          items:
            type: object
            properties:
              TrackingId: { type: integer, description: Archer content ID. }
              ContentPartId: { type: string, maxLength: 100, description: External record key. }

    # ---- metadata
    Application:
      type: object
      properties:
        Id: { type: integer }
        Name: { type: string }
        Alias: { type: string }
        Guid: { type: string }
        Description: { type: [string, "null"] }
        KeepLicensed: { type: boolean }
        IsDeprecated: { type: boolean }
        UpdateInformation: { $ref: '#/components/schemas/UpdateInformation' }
      additionalProperties: true
    Level:
      type: object
      properties:
        Id: { type: integer }
        ModuleId: { type: integer }
        Name: { type: string }
        Alias: { type: string }
        Guid: { type: string }
        IsDeleted: { type: boolean }
      additionalProperties: true
    FieldDefinition:
      type: object
      properties:
        Id: { type: integer }
        LevelId: { type: integer }
        Type: { $ref: '#/components/schemas/FieldType' }
        Name: { type: string }
        Alias: { type: string }
        IsActive: { type: boolean }
        Guid: { type: string }
        ASOStatus: { type: integer }
        SystemType: { type: integer }
        IsPrivate: { type: boolean }
        IsContentReadOnly: { type: boolean }
        IsRequired: { type: boolean }
        IsCalculated: { type: boolean }
        EsFieldMappingId: { type: [integer, "null"] }
        RelatedValuesListId: { type: integer, description: Values List fields only. }
        UpdateInformation: { $ref: '#/components/schemas/UpdateInformation' }
        FieldMap: { type: [object, "null"] }
      additionalProperties: true
    ValuesListValue:
      type: object
      properties:
        Id: { type: integer }
        Name: { type: string }
        ValuesListId: { type: integer }
        ParentId: { type: [integer, "null"] }
        NumericValue: { type: [number, "null"] }
        IsSelectable: { type: boolean }
        SortOrder: { type: integer }
        Guid: { type: string }
        Children: { type: array, items: { $ref: '#/components/schemas/ValuesListValue' }, description: Hierarchical form only. }
      additionalProperties: true
    SecurityParameter:
      type: object
      properties:
        Id: { type: integer }
        Alias: { type: string }
        GUID: { type: string }
        Name: { type: string }
        Description: { type: string }
        MinPasswordLength: { type: integer }
        AlphaCharsRequired: { type: integer }
        NumericCharsRequired: { type: integer }
        UppercaseCharsRequired: { type: integer }
        LowercaseCharsRequired: { type: integer }
        SpecialCharsRequired: { type: integer }
        PasswordChangeInterval: { type: integer }
        PasswordChangeLimit: { type: boolean }
        GraceLogins: { type: integer }
        MaximumFailedLoginAttempts: { type: integer }
        PreviousPasswordsDisallowed: { type: integer }
        LockoutPeriod: { type: integer }
        LockoutPeriodType: { type: integer, description: 1 Hours, 2 Minutes, 3 Days }
        SessionTimeout: { type: integer }
        SessionTimeoutType: { type: integer, description: 1 Hours, 2 Minutes, 3 Days }
        StaticSessionTimeout: { type: [integer, "null"] }
        PasswordExpirationNotice: { type: integer }
        AutomaticAccountDeactivation: { type: integer }
        IsLimitByTimeFrame: { type: boolean }
        PermittedFromTime: { type: string }
        PermittedToTime: { type: string }
        IsDisallowedByDays: { type: boolean }
        DisallowedSessionDays: { type: array, items: { type: integer }, description: Bit flags 1 Sun, 2 Mon, 4 Tue, 8 Wed, 16 Thu, 32 Fri, 64 Sat. }
        IsDisallowedByDates: { type: boolean }
        DisallowedDates: { type: array, items: { type: object, properties: { LockedDate: { type: string } } } }
        Default: { type: boolean }
        TimeZoneCode: { type: string, example: Central Standard Time }
        SecurityParameterType: { type: integer }
      required: [Name]

    # ---- users / groups / roles
    User:
      type: object
      properties:
        Id: { type: integer }
        DisplayName: { type: string, readOnly: true }
        FirstName: { type: string }
        MiddleName: { type: [string, "null"] }
        LastName: { type: string }
        UserName: { type: string }
        LastLoginDate: { type: [string, "null"], format: date-time, readOnly: true }
        AccountStatus: { type: integer, description: 1 Active, 2 Inactive, 3 Locked }
        DomainId: { type: [integer, "null"] }
        SecurityId: { type: integer, description: Security parameter ID. }
        Locale: { type: [string, "null"], example: en-US }
        TimeZoneId: { type: string, example: Eastern Standard Time }
        Address: { type: [string, "null"] }
        Company: { type: [string, "null"] }
        Title: { type: [string, "null"] }
        AdditionalNote: { type: [string, "null"] }
        BusinessUnit: { type: [string, "null"] }
        Department: { type: [string, "null"] }
        ForcePasswordChange: { type: boolean }
        DistinguishedName: { type: [string, "null"] }
        Type: { type: integer }
        LanguageId: { type: [integer, "null"] }
        DefaultHomeDashboardId: { type: [integer, "null"] }
        DefaultHomeWorkspaceId: { type: [integer, "null"] }
        EnableApproveContentByEmail: { type: boolean }
        UpdateInformation: { $ref: '#/components/schemas/UpdateInformation' }
    UserWrapper:
      type: object
      properties:
        User: { $ref: '#/components/schemas/User' }
        Password: { type: string, format: password, description: Required on create. }
        Notification: { type: boolean, description: Send the new-account notification email. }
        Contacts: { type: [array, "null"], items: { $ref: '#/components/schemas/Contact' } }
        Roles: { type: [array, "null"], items: { type: integer } }
        Groups: { type: [array, "null"], items: { type: integer } }
      required: [User]
    Contact:
      type: object
      properties:
        Id: { type: integer, readOnly: true }
        ContactType: { type: integer, description: 7 Email, 9 Phone }
        ContactSubType: { type: integer, description: "1 Assistant, 2 Business, 3 Business2, 4 Business Fax, 5 Home, 6 Home2, 7 Home Fax, 8 ISDN, 9 Mobile, 10 Mobile2, 11 Other, 12 Other2, 13 Other Fax, 14 Pager (email allows 2,3,5,6,9,10,11,12,14)." }
        Value: { type: string }
        IsDefault: { type: boolean }
    Task:
      type: object
      properties:
        TaskId: { type: integer }
        Title: { type: string }
        Description: { type: string }
        DueDate: { type: string, format: date-time }
        IsComplete: { type: boolean }
        TargetContentId: { type: integer }
    Group:
      type: object
      properties:
        Id: { type: integer }
        Name: { type: string }
        DisplayName: { type: string, readOnly: true }
        Description: { type: [string, "null"] }
        EveryoneFlag: { type: boolean }
        Guid: { type: string }
        SystemFlag: { type: boolean }
        LdapFlag: { type: boolean }
        DomainId: { type: [integer, "null"] }
        DistinguishedName: { type: [string, "null"] }
        DefaultHomeDashboardId: { type: [integer, "null"] }
        DefaultHomeWorkspaceId: { type: [integer, "null"] }
        UpdateInformation: { $ref: '#/components/schemas/UpdateInformation' }
    GroupWrapper:
      type: object
      properties:
        Group: { $ref: '#/components/schemas/Group' }
        ParentGroups: { type: [array, "null"], items: { type: integer } }
        ChildGroups: { type: [array, "null"], items: { type: integer } }
        ChildUsers: { type: [array, "null"], items: { type: integer } }
      required: [Group]
    AccessRole:
      type: object
      properties:
        Id: { type: integer }
        Name: { type: string }
        Alias: { type: string }
        Description: { type: [string, "null"] }
        IsDefault: { type: boolean }
      additionalProperties: true
    AccessRoleTask:
      type: object
      properties:
        TaskId: { type: [integer, string] }
        HasCreate: { type: boolean }
        HasRead: { type: boolean }
        HasUpdate: { type: boolean }
        HasDelete: { type: boolean }
    RoleWrapper:
      type: object
      properties:
        AccessRole: { $ref: '#/components/schemas/AccessRole' }
        GroupIds: { type: [array, "null"], items: { type: integer } }
        AccessRoleTasks: { type: [array, "null"], items: { $ref: '#/components/schemas/AccessRoleTask' } }
      required: [AccessRole]

    # ---- packages
    PackageObject:
      type: object
      properties:
        Guid: { type: string }
        Name: { type: string }
        Type: { type: string, example: Application, description: "Application, Questionnaire, SubForm, GlobalReport, ... (as shown by the UI-generated code)" }
    PackageCreateRequest:
      type: object
      properties:
        Name: { type: string }
        Description: { type: string }
        PreparedBy: { type: string }
        PackageObjects: { type: array, items: { $ref: '#/components/schemas/PackageObject' } }
      required: [Name, PackageObjects]
    PackageInstallRequest:
      type: object
      properties:
        PackageId: { type: integer }
        InactivateUnusedFields: { type: boolean }
        PrefixInactivatedFields: { type: [string, "null"] }
        InstallOptions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/PackageObject'
              - properties:
                  TranslationOption: { type: integer }
                  InstallMethod: { type: integer }
                  InstallOption: { type: integer }
      required: [PackageId, InstallOptions]

    # ---- reports
    SecurityEvent:
      type: object
      properties:
        Event: { type: string }
        InitiatingUser: { type: string }
        Timestamp: { type: string, format: date-time }
        EventDetails: { type: string }
    AdministrationActivityLog:
      type: object
      properties:
        InitiatingUser: { type: string }
        UserId: { type: [integer, "null"] }
        ModuleId: { type: integer }
        ModuleName: { type: [string, "null"] }
        LevelId: { type: integer }
        LevelName: { type: string }
        ObjectName: { type: [string, "null"] }
        ActionType: { type: string }
        PropertyName: { type: string }
        NewValue: { type: string }
        OldValue: { type: string }
        Timestamp: { type: string, format: date-time }
        SectionName: { type: string }

    # ---- content api
    ODataServiceDocument:
      type: object
      properties:
        "@odata.context": { type: string }
        value:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              kind: { type: string, example: EntitySet }
              url: { type: string }
    ODataCollection:
      type: object
      properties:
        "@odata.context": { type: string }
        value:
          type: array
          items: { type: object, additionalProperties: true }
