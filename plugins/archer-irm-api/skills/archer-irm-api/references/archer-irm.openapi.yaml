  # ---------------------------------------------------------------- Users
  /platformapi/core/system/user:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Get all users
      description: Documented as POST + override so that the OData options can be sent in the body; `$filter`, `$select`, `$orderby`, `$top`, `$skip` on user properties.
      parameters: [ { $ref: '#/components/parameters/odataFilter' }, { $ref: '#/components/parameters/odataSelect' }, { $ref: '#/components/parameters/odataOrderby' }, { $ref: '#/components/parameters/odataTop' }, { $ref: '#/components/parameters/odataSkip' }, { $ref: '#/components/parameters/methodOverride' } ]
      responses: { "200": { $ref: '#/components/responses/UserList' } }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create user
      description: Required `User.FirstName`, `User.LastName` and top-level `Password`. `AccountStatus` 1 Active, 2 Inactive, 3 Locked. Default role is General User; default user name is last name + first initial (`doej`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserWrapper' }
            example:
              User: { FirstName: "John", LastName: "Doe", UserName: "jdoe", AccountStatus: 1, SecurityId: 1, TimeZoneId: "Eastern Standard Time", Locale: "en-US", ForcePasswordChange: true }
              Password: "********"
              Notification: true
              Roles: [73]
              Groups: [141]
              Contacts: [ { ContactType: 7, ContactSubType: 2, Value: "john.doe@example.com", IsDefault: true } ]
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
    put:
      tags: [Users]
      operationId: updateUser
      summary: Update user
      description: |
        Full replacement of the profile: send every existing property value you want to keep, because
        omitted ones reset (MiddleName, Title, Locale, LanguageId, DefaultHomeDashboardId/WorkspaceId
        become null; TimeZoneId, ForcePasswordChange, SecurityId, DomainId revert to defaults).
        `Contacts`, `Roles`, `Groups`: null leaves them unchanged, a list replaces them.
        `Id`, `FirstName`, `LastName`, `UserName`, `AccountStatus` are required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserWrapper' }
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
  /platformapi/core/system/user/{userId}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get user by ID
      parameters: [ { $ref: '#/components/parameters/userId' }, { $ref: '#/components/parameters/methodOverride' } ]
      responses: { "200": { $ref: '#/components/responses/UserSingle' } }
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete user
      parameters: [ { $ref: '#/components/parameters/userId' } ]
      responses: { "200": { $ref: '#/components/responses/IdResponse' } }
